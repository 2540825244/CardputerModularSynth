[env:cardputer]
platform = espressif32@6.11.0
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
build_unflags = -Os -std=gnu++11
build_flags = -O2 -std=gnu++17 -DARDUINO_USB_CDC_ON_BOOT=1 -DARDUINO_USB_MODE=1 -DMODSYNTH_SERIAL_LOG
lib_deps =
    m5stack/M5Unified@0.2.28
    m5stack/M5GFX@0.2.35
    m5stack/M5Cardputer@1.1.1
    bblanchon/ArduinoJson@^7.4
build_src_filter = +<*> -<probe/> -<bench/>
; -Os and -fno-exceptions off the audio path (fits the 1 MB modsyn slot); see the script
extra_scripts = pre:tools/build/size_flags.py

; What tools/release.sh ships: no serial diagnostics, and __FILE__ paths in the binary relative
; (no local user or folder names).
[env:release]
extends = env:cardputer
build_flags = -O2 -std=gnu++17 -DARDUINO_USB_CDC_ON_BOOT=1 -DARDUINO_USB_MODE=1
    -fmacro-prefix-map=${platformio.packages_dir}=pio
    -fmacro-prefix-map=$PROJECT_DIR=.

[env:probe]
extends = env:cardputer
build_src_filter = +<probe/>

[env:bench]
extends = env:cardputer
build_src_filter = +<bench/> +<core/> +<render/> +<ui/>

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Wall -Wdouble-promotion -DNATIVE -fsanitize=address -g
lib_deps = bblanchon/ArduinoJson@^7.4
build_src_filter = +<core/> +<ui/>
test_build_src = yes
